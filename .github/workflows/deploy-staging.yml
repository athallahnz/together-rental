name: deploy-staging

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: together-rental-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.STAGING_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Confirm successful SHA is still main
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "Skipping superseded commit $RELEASE_SHA; main is $current"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Checkout successful commit
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup PHP
        if: steps.guard.outputs.deploy == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build production assets
        if: steps.guard.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          cp .env.example .env
          php artisan wayfinder:generate --with-form
          npm ci
          npm run build
          test -s public/build/manifest.json
          tar -czf "$RUNNER_TEMP/staging-build.tar.gz" -C public build
          sha256sum "$RUNNER_TEMP/staging-build.tar.gz"

      - name: Transfer and activate staging release
        if: steps.guard.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${STAGING_SSH_HOST:?Missing staging host}"
          : "${STAGING_SSH_USER:?Missing staging user}"
          : "${STAGING_SSH_KEY:?Missing private key}"
          : "${STAGING_SSH_KNOWN_HOSTS:?Missing verified host key}"
          port="${STAGING_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]

          current=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "Skipping superseded commit $RELEASE_SHA; main is $current"
            exit 0
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          unset STAGING_SSH_KEY STAGING_SSH_KNOWN_HOSTS
          ssh_args=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$port")
          target="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          ssh "${ssh_args[@]}" "$target" 'mkdir -p "$HOME/tr-staging-incoming"'
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -P "$port" "$RUNNER_TEMP/staging-build.tar.gz" \
            "$target:tr-staging-incoming/$RELEASE_SHA.tar.gz"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -P "$port" scripts/deploy-staging-release.sh \
            "$target:tr-staging-incoming/deploy-staging-release.sh"
          checksum=$(sha256sum "$RUNNER_TEMP/staging-build.tar.gz" | cut -d ' ' -f 1)
          ssh "${ssh_args[@]}" "$target" \
            "bash tr-staging-incoming/deploy-staging-release.sh '$RELEASE_SHA' '$checksum'"
